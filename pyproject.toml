[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.data"
version = "0.0.1rc4"
description = "Dataset distribution + metadata for quantem: Hugging Face upload/download and Velox EMD parsing"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10",
    "huggingface_hub>=0.20",   # huggingface.py: shared 4D-STEM / HAADF dataset transfer
    "pyyaml>=6",               # human-readable metadata sidecars (meta.yaml)
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "numpy>=1.24",
]

[project.scripts]
quantem-data = "quantem.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

