[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.data"
version = "0.0.1rc3"
description = "Dataset distribution + metadata for quantem: Hugging Face upload/download and Velox EMD parsing"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10",
    "huggingface_hub>=0.20",   # hub.py: shared 4D-STEM / HAADF dataset transfer
]

[project.scripts]
quantem-data = "quantem.data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]

