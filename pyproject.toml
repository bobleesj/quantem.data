[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "quantem-data"
version = "0.0.2a3"
description = "Example datasets for quantem — real electron microscopy data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["electron-microscopy", "4dstem", "datasets", "quantem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.0.0",
    "huggingface-hub>=0.20.0",
    "anywidget>=0.9.0",
    "traitlets>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/bobleesj/quantem.data"
Documentation = "https://bobleesj.github.io/quantem.data/"
Repository = "https://github.com/bobleesj/quantem.data"
"Hugging Face" = "https://huggingface.co/datasets/bobleesj/quantem-data"

[project.scripts]
quantem-data = "quantem.data.cli:main"

[tool.hatch.build]
only-packages = true
artifacts = ["src/quantem/data/static/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/quantem/data/static/browser.js"]
skip-if-exists = ["src/quantem/data/static/browser.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]
